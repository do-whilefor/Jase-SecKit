    <text x="116" y="268" fill="#c9c8c1" font-size="26">Keep evidence. Connect the next step.</text>
    <text x="1320" y="192" fill="#a8aaa5" font-size="15" letter-spacing="2" text-anchor="end">SECURITY RESEARCH SKILL</text>
    <rect x="112" y="310" width="1216" height="66" rx="9" fill="url(#prompt)" stroke="#ffffff" stroke-opacity=".07" />
    <g font-family="DejaVu Sans Mono, monospace" font-size="23">
