<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Webounty — Keep evidence. Connect the next step.</title>
  <desc id="desc">Workflow illustration, not a product screenshot. Record original evidence, retrieve local knowledge through lexical and explicit relationship search, and verify candidate connections.</desc>
  <defs>
