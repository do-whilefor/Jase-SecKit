    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#262a2d" /><stop offset="1" stop-color="#171b1e" />
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#353432" /><stop offset="1" stop-color="#262b2e" />
    </linearGradient>
  </defs>
  <rect width="1440" height="760" rx="26" fill="url(#backdrop)" />
  <rect x="67" y="68" width="1306" height="641" rx="23" fill="#38281e" opacity=".10" />
